<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - VeriAttend</title>
    <link rel="stylesheet" href="css/style.css?v=glass2">
</head>
<body class="login-page">
    <!-- Top-Left Corner Branding -->
    <header class="top-left-brand">
        <div class="brand-logo-wrap">
            <img src="images/veriattend_logo.jpg" alt="VeriAttend Logo" class="brand-logo-img">
            <div class="brand-text-wrap">
                <span class="brand-title">VeriAttend AI</span>
                <span class="brand-sub">AI-Powered Verified Attendance Engine</span>
            </div>
        </div>
    </header>

    <!-- Centered Login Board -->
    <div class="login-card-single">
        <div class="login-header" style="text-align: center; margin-bottom: 24px;">
            <h1 style="font-size: 26px; font-weight: 800; color: #ffffff; margin-bottom: 6px; text-shadow: 0 2px 8px rgba(0,0,0,0.6);">Welcome Back</h1>
            <p style="font-size: 14px; color: #cbd5e1; font-weight: 600; margin: 0;">Select your role & sign in to continue</p>
        </div>

        <!-- Role Selector Toggle -->
        <div class="role-selector" id="roleSelector">
            <button type="button" class="role-btn active" data-role="student">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 14l9-5-9-5-9 5 9 5z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0112 20.055a11.952 11.952 0 01-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z" />
                </svg>
                Student
            </button>
            <button type="button" class="role-btn" data-role="teacher">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z" />
                </svg>
                Teacher
            </button>
            <button type="button" class="role-btn" data-role="admin">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
                Admin
            </button>
        </div>

        <!-- Error Alert Container -->
        <div id="errorMessage" class="alert alert-error alert-hidden">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span id="errorText">Invalid credentials</span>
        </div>

        <!-- Login Form -->
        <form id="loginForm">
            <input type="hidden" id="selectedRole" value="student">

            <div class="form-group">
                <label class="form-label" id="idLabel" for="username">USN</label>
                <div class="input-wrapper">
                    <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                    </svg>
                    <input type="text" id="username" class="form-control" placeholder="e.g. 1AR24CS000" required autocomplete="username">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <div class="input-wrapper">
                    <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                    </svg>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
                    <button type="button" class="toggle-password" id="togglePassword" title="Toggle password visibility">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                    </button>
                </div>
            </div>

            <div class="form-options">
                <label class="checkbox-wrapper">
                    <input type="checkbox" id="rememberMe">
                    <span>Remember me</span>
                </label>
            </div>

            <button type="submit" id="submitBtn" class="btn-primary">
                <span class="spinner"></span>
                <span class="btn-text">Sign In</span>
            </button>
        </form>

        <div class="login-footer">
            <span>Don't have an account? <a href="#">Contact your administrator</a></span>
        </div>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const roleButtons = document.querySelectorAll('.role-btn');
            const selectedRoleInput = document.getElementById('selectedRole');
            const idLabel = document.getElementById('idLabel');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const togglePasswordBtn = document.getElementById('togglePassword');
            const loginForm = document.getElementById('loginForm');
            const submitBtn = document.getElementById('submitBtn');
            const errorMessage = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');

            const roleConfig = {
                student: { label: 'USN', placeholder: 'Enter your USN (e.g. 1AR24CS000)' },
                teacher: { label: 'Teacher ID', placeholder: 'Enter your Teacher ID (e.g. TCH2026-007)' },
                admin: { label: 'Admin ID', placeholder: 'Enter your Admin ID (e.g. ADMIN-001)' },
            };

            function applyRole(role) {
                const cfg = roleConfig[role];
                idLabel.textContent = cfg.label;
                usernameInput.placeholder = cfg.placeholder;
                usernameInput.value = '';
                passwordInput.value = '';
            }

            // Apply default role setup
            applyRole('student');

            // Switch role (Student / Teacher / Admin)
            roleButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    roleButtons.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    const role = btn.getAttribute('data-role');
                    selectedRoleInput.value = role;
                    applyRole(role);
                    hideError();
                });
            });

            // Password visibility toggle
            togglePasswordBtn.addEventListener('click', () => {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
            });

            function showError(msg) {
                errorText.textContent = msg;
                errorMessage.classList.remove('alert-hidden');
            }

            function hideError() {
                errorMessage.classList.add('alert-hidden');
            }

            // Real Form Submit Handler calling Auth.login
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                hideError();

                const username = usernameInput.value.trim();
                const password = passwordInput.value;
                const role = selectedRoleInput.value;

                submitBtn.disabled = true;
                submitBtn.classList.add('btn-loading');

                try {
                    const response = await Auth.login(username, password, role);
                    if (response && response.success) {
                        const targetRole = response.user.role || role;
                        if (targetRole === 'teacher') {
                            window.location.href = 'teacher-dashboard.html';
                        } else if (targetRole === 'admin') {
                            window.location.href = 'admin-dashboard.html';
                        } else {
                            window.location.href = 'student-dashboard.html';
                        }
                    }
                } catch (err) {
                    showError(err.message || 'Login failed. Please check your credentials.');
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.classList.remove('btn-loading');
                }
            });
        });
    </script>
</body>
</html>
