<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Attendance</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="topbar">
    <h1>My Attendance</h1>
    <div>
      <span class="user-info" id="user-name"></span>
      <button class="logout" onclick="logout()">Log out</button>
    </div>
  </div>

  <div class="page">
    <!-- Summary stat strip -->
    <div class="stat-strip" id="stat-strip">
      <div class="stat-card"><div class="stat-number accent" id="stat-total">—</div><div class="stat-label">This Month</div></div>
      <div class="stat-card"><div class="stat-number green" id="stat-present">—</div><div class="stat-label">Present</div></div>
      <div class="stat-card"><div class="stat-number amber" id="stat-late">—</div><div class="stat-label">Late</div></div>
      <div class="stat-card"><div class="stat-number red" id="stat-absent">—</div><div class="stat-label">Absences</div></div>
    </div>

    <div class="card">
      <h2>Attendance History</h2>
      <table id="attendance-table">
        <thead>
          <tr><th>Date</th><th>Status</th><th>Entry Time</th><th>Exit Time</th></tr>
        </thead>
        <tbody id="attendance-body"></tbody>
      </table>
      <div id="empty-msg" style="display:none; color: var(--text-dim); padding: 20px 0;">
        No attendance records yet.
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="student-dashboard.js"></script>
</body>
</html>
